spring:
  application:
    name: stravgui

  datasource:
    url: jdbc:postgresql://localhost:5433/stravgui
    username: stravgui
    password: stravgui
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

stravgui:
  jwt:
    secret: ${JWT_SECRET:changeit-local-dev-secret-key-min-32-chars-long}
    expiration-minutes: 60

  strava:
    client-id: ${STRAVA_CLIENT_ID}
    client-secret: ${STRAVA_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/api/auth/strava/callback

  encryption:
    secret: ${ENCRYPTION_SECRET}
    salt: ${ENCRYPTION_SALT}